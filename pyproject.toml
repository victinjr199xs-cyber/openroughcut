[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openroughcut"
version = "0.1.0"
description = "Open-source AI rough-cut tool for talking-head videos and podcasts: removes silences, filler words and repeated takes, generates captions and multicam switches, and exports timelines for Premiere Pro, DaVinci Resolve and Final Cut."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "OpenRoughCut contributors" }]
keywords = ["video-editing", "premiere-pro", "whisper", "silence-removal", "captions", "podcast", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]
ai = ["anthropic>=0.70", "pydantic>=2"]
all = ["faster-whisper>=1.0", "anthropic>=0.70", "pydantic>=2"]
dev = ["pytest>=8"]

[project.scripts]
orc = "openroughcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
