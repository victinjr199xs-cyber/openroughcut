<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: sans-serif; font-size: 12px; color: #ddd; background: #232323; padding: 10px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: block; margin: 4px 0; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; }
    textarea { height: 56px; }
    .row { margin: 8px 0; }
    #status { white-space: pre-wrap; margin-top: 10px; color: #aaa; }
    .err { color: #f88 !important; }
  </style>
</head>
<body>
  <h1>OpenRoughCut</h1>
  <div class="row">
    <sp-button id="pick" variant="secondary">Choose recording…</sp-button>
    <div id="file">No file selected</div>
  </div>
  <div class="row">
    <label><input type="checkbox" id="silence" checked> Remove silences</label>
    <label><input type="checkbox" id="fillers" checked> Remove filler words (um, uh)</label>
    <label><input type="checkbox" id="retakes" checked> Remove repeated takes</label>
    <label><input type="checkbox" id="captions" checked> Generate captions (SRT)</label>
    <label><input type="checkbox" id="ai"> Claude editorial pass</label>
    <textarea id="instructions" placeholder="Optional instructions for Claude, e.g. 'cut the small talk at the start'"></textarea>
    <label>Language <input type="text" id="language" placeholder="auto (e.g. en, pt)"></label>
  </div>
  <sp-button id="run" variant="cta">Rough cut</sp-button>
  <div id="status">Start the engine first: <code>orc serve</code></div>
  <script src="main.js"></script>
</body>
</html>
